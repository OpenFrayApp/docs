# One genuine attack. Optional branches settle its actual result; never reroll.
steps:
  - use: tutorial-damage
  - click: { role: button, name: Javelin., exact: true }
  - click:
      {
        role: button,
        name: Zara,
        exact: true,
        within: { css: '[role=dialog][aria-label="Ogre · Javelin"]' },
      }
  - click: { role: button, name: Roll attack, exact: true }
  - wait: 500
  - optional:
      - click: { role: button, name: Apply to Zara, exact: true }
  - optional:
      - click: { role: button, name: Close, exact: true }
  - wait: { css: '[data-tutorial-guide]', contains: Choose Apply effect }
