# The actual tutorial, in a fresh anonymous context. No session or shared fixture.
steps:
  - wait: { role: button, name: Start tutorial, exact: true }
  - click: { role: button, name: Start tutorial, exact: true }
  - use: add-pc
    with: { pc: $tutorial.pc }
  - click: { role: button, name: Quick add, exact: true }
  - fill: { label: Quick add name }
    value: $tutorial.ally.name
  - fill: { label: Max HP }
    value: $tutorial.ally.hp
  - fill: { label: AC, exact: true }
    value: $tutorial.ally.ac
  - select: { label: Side, exact: true }
    option: friend
  - click: { role: button, name: Add, exact: true }
  - each: [Mage, Ogre]
    as: creature
    steps:
      - click: { role: button, name: Add creature, exact: true }
      - fill: { placeholder: Search creatures… }
        value: $creature
      - wait: 400
      - click: { role: button, name: $creature, matching: '^$creature' }
      - wait: 400
