# yaml-language-server: $schema=../../node_modules/shotlist/dist/recipe.schema.json
#
# An attack rolled and waiting to be applied (fight/attacks.md).
name: attack-resolve
install: docs

setup:
  - use: dismiss-tutorial
  - use: seed
  - use: start
  - use: open-attack
  - click: { role: button, name: Roll attack }
  - wait: 600

clip:
  span:
    - { css: '[role=dialog] > div:first-child' }
    - { css: '[role=dialog] > div.mt-3 > div.flex.flex-wrap.items-center' }
  grow: { top: 14, right: 14, bottom: 4, left: 14 }

marks:
  target: { role: button, name: Zara, exact: true, within: clip }
  roll: { role: button, name: Reroll, within: clip }
  apply: { role: button, name: Apply to Zara, within: clip }

# The panel's right side is empty past the chips and the apply button, so those two
# labels sit inside the shot; the roll row runs the panel's width, so its label stays in
# the left margin.
callouts:
  - { mark: target, text: Who it hits, place: right, inside: true }
  - { mark: apply, text: Take the damage off, place: right, inside: true }
  - { mark: roll, text: The roll and the result, place: left }

# End the crop at the damage controls, before the outcome-dependent miss warning.
check:
  ignore:
    - { css: '[role=dialog] > div.flex.items-center.gap-3', within: clip }
    - { css: '[role=dialog] > div.mt-3 > div.mb-2', within: clip }
    - { css: 'input[aria-label="Damage to apply"]', within: clip }
    - { role: button, name: Apply to Zara, within: clip }
