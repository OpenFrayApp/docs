# yaml-language-server: $schema=../../node_modules/shotlist/dist/recipe.schema.json
#
# The Characters tab with a saved character open (reference/compendium.md). The four are
# the handbook's own sample party, saved on the `gm` fixture account.
name: characters-tab
install: docs
session: gm
# Short on purpose: the detail pane fills whatever height it is given, and the
# content ends well before the buttons at its foot.
viewport: { width: 1800, height: 820 }

setup:
  - click: { css: 'button[aria-label="Show the compendium"]' }
  - wait: { css: '[role=tablist]', contains: Characters }
  - click: { css: button, text: Characters }
  - wait: { text: Zara }
  - click: { text: Zara }
  - wait: 800

clip:
  span:
    - { css: '[role=tablist]' }
    - { css: button, text: Delete }
  pad: 22

marks:
  add: { css: button, text: Add to encounter }

# The one button the page's own sentence sends the reader to.
callouts:
  - { mark: add }
