# yaml-language-server: $schema=../../node_modules/shotlist/dist/recipe.schema.json
#
# The dice bar and the log entry it just wrote (reference/dice.md). Shot short: a 560-tall
# viewport keeps the newest entry beside the bar, so the crop is a band rather than a page.
name: dice-log
install: docs
viewport: { width: 1440, height: 560 }

# The swipe shell keeps a hidden copy of the dice bar in the DOM, so every query here
# names the visible one.
setup:
  - use: seed
  - use: start
  - fill: { css: 'input[aria-label="Dice formula"]', visible: true }
    value: 1d20+2
  - click: { role: button, name: Roll, exact: true }
  - wait: 600

clip:
  span:
    - { css: 'input[aria-label="Dice formula"]', visible: true }
    - { css: button, text: d4, visible: true, pick: last }
    - { css: li, contains: 1d20+2, visible: true, pick: last }
  pad: 16

marks:
  bar:
    span:
      - { css: 'input[aria-label="Dice formula"]', visible: true }
      - { css: button, text: d4, visible: true, pick: last }
  entry: { css: li, contains: 1d20+2, visible: true, pick: last }

# The bar sits along the foot of the console and the log runs down its right — so the
# bar's label comes in from the side, where a label above it would send its arrow the
# whole height of the shot, across the stat block on the way.
callouts:
  - { mark: bar, text: Roll anything by hand, place: left }
  - { mark: entry, text: 'Every roll, with its dice', place: top }

# The entry's numbers are a real roll, but its box is a fixed row of the log, so the
# check masks the entry and still guards the bar and the frame around it.
check:
  ignore:
    - { css: li, contains: 1d20+2, visible: true, pick: last }
