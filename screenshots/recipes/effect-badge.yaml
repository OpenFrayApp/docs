# yaml-language-server: $schema=../../node_modules/shotlist/dist/recipe.schema.json
#
# What an effect looks like from the tracker: a badge on the row (fight/effects.md).
name: effect-badge
install: docs

setup:
  - use: seed
  - use: start
  - use: frighten

clip:
  trackerRow: Ogre
  pad: 18

marks:
  # The badge carries its own remove × beside the name, so the whole of it is never
  # exactly "Frightened" — the smallest box holding the word is the badge itself.
  badge: { within: clip, contains: Frightened, pick: smallest }

# Nudged left so the arrow comes in at a slant: the badge sits under the creature's name,
# and straight down from a centred label the shaft runs through it.
callouts:
  - { mark: badge, text: An effect on this creature, place: top, dx: -200 }
