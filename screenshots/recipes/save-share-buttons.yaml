# yaml-language-server: $schema=../../node_modules/shotlist/dist/recipe.schema.json
#
# The save and share buttons at the foot of the tracker (guides/saving.md and
# guides/publishing.md): the floppy disk and the share icon, side by side, both enabled
# once there's something on the board.
name: save-share-buttons
install: docs

setup:
  - use: seed
  - wait: 300

# Grown just enough to hold the pair and their two labels underneath; the tracker rows
# above are what the reader already knows to be there, so the crop stays close.
clip:
  span:
    - { css: 'button[aria-label="Save this encounter"]' }
    - { css: 'button[aria-label="Share this encounter"]' }
  grow: { left: 90, right: 100, top: 20, bottom: 20 }

marks:
  save: { css: 'button[aria-label="Save this encounter"]' }
  share: { css: 'button[aria-label="Share this encounter"]' }

callouts:
  - { mark: save, text: Save, place: left }
  - { mark: share, text: Share, place: right }
