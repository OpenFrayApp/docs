# yaml-language-server: $schema=../../node_modules/shotlist/dist/recipe.schema.json
name: sign-in
install: docs
viewport: { width: 1800, height: 760 }

setup:
  - click: { role: button, name: Sign in, exact: true }
  - wait: { role: dialog, name: Sign in }

clip:
  span:
    - { css: '[role="dialog"][aria-label="Sign in"] a[title="OpenFray home"]' }
    - { css: button, text: Back to the console }
    - { css: p, contains: 'You must be at least 13' }
  pad: 24
