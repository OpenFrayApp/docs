name: tutorial-attack
install: docs
url: http://localhost:5199/console/
viewport: { width: 1440, height: 820 }
retries: 0
setup:
  - use: tutorial-damage
  - click: { role: button, name: Javelin., exact: true }
  - click:
      {
        role: button,
        name: Zara,
        exact: true,
        within: { css: '[role=dialog][aria-label="Ogre · Javelin"]' },
      }
  - wait: 400
clip:
  span:
    - { css: '[role=dialog][aria-label="Ogre · Javelin"]' }
    - { css: '[data-tutorial-guide]' }
  pad: 16
marks:
  roll: { role: button, name: Roll attack, exact: true }
  exit: { role: button, name: Exit tutorial, exact: true }
callouts:
  - { mark: roll, n: 3, place: corner, badge: tr, inside: true }
  - { mark: exit }
