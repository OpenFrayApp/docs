name: tutorial-cleanup
install: docs
url: http://localhost:5199/console/
viewport: { width: 1440, height: 820 }
retries: 0
setup:
  - use: tutorial-clear
clip:
  span:
    - { css: 'button[aria-label="Remove everyone and clear the log"]' }
    - { css: '[data-tutorial-guide]' }
  pad: 16
marks:
  clear: { role: button, name: Remove everyone and clear the log, exact: true }
  guide: { css: '[data-tutorial-guide]' }
callouts:
  - { mark: clear }
  - { mark: guide }
check:
  ignore:
    - span:
        - { trackerRow: Zara }
        - { trackerRow: Mira }
        - { trackerRow: Mage }
        - { trackerRow: Ogre }
    - { css: section, containingAll: [Mira, Quick add], pick: smallest }
