name: tutorial-complete
install: docs
url: http://localhost:5199/console/
viewport: { width: 1440, height: 820 }
retries: 0
setup:
  - use: tutorial-clear
  - dialog: dismiss
  - click: { role: button, name: Remove everyone and clear the log, exact: true }
  - wait: { css: '[data-tutorial-guide]', contains: Cancel leaves cleanup pending }
  - dialog: accept
  - click: { role: button, name: Remove everyone and clear the log, exact: true }
  - wait: { heading: Tutorial complete }
clip: { role: dialog, name: Tutorial complete, exact: true, pad: 16 }
marks:
  decline: { role: button, name: Continue without an account, exact: true }
callouts:
  - { mark: decline }
