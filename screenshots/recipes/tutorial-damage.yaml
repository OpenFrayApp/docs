name: tutorial-damage
install: docs
url: http://localhost:5199/console/
viewport: { width: 1440, height: 820 }
retries: 0
setup:
  - use: tutorial-start
  - click:
      css: 'button:not([aria-label])'
      matching: '^\d+$'
      within: { trackerRow: Ogre }
      pick: first
  - fill: { label: Hit points for Ogre, exact: true }
    value: '-3'
  - wait: 400
clip:
  span:
    - { trackerRow: Ogre }
  pad: 16
marks:
  damage: { label: Hit points for Ogre, exact: true }
callouts:
  - { mark: damage }
