name: tutorial-phone
install: docs
url: http://localhost:5199/console/
viewport: { width: 375, height: 812 }
retries: 0
setup:
  - click: { role: button, name: Start tutorial, exact: true }
  - click: { role: button, name: Add to the encounter, exact: true }
  - wait: 400
clip: viewport
marks:
  add: { role: menuitem, name: Add PC, exact: true }
  exit: { role: button, name: Exit tutorial, exact: true }
callouts:
  - { mark: add }
  - { mark: exit }
