name: tutorial-prone
install: docs
url: http://localhost:5199/console/
viewport: { width: 1440, height: 820 }
retries: 0
setup:
  - use: tutorial-attack
  - click: { role: button, name: Apply effect, exact: true }
  - click: { role: button, name: Prone, exact: true }
  - wait: 400
clip: { css: '[role=dialog][aria-label="Apply effect to Ogre"]', pad: 16 }
marks:
  prone: { role: button, name: Prone, exact: true }
  apply: { role: button, name: Apply, exact: true }
callouts:
  - { mark: prone }
  - { mark: apply }
