name: tutorial-quick-add
install: docs
url: http://localhost:5199/console/
viewport: { width: 1440, height: 820 }
retries: 0
setup:
  - click: { role: button, name: Start tutorial, exact: true }
  - use: add-pc
    with: { pc: $tutorial.pc }
  - click: { role: button, name: Quick add, exact: true }
  - fill: { label: Quick add name }
    value: $tutorial.ally.name
  - fill: { label: Max HP }
    value: 30
  - fill: { label: AC, exact: true }
    value: 12
  - select: { label: Side, exact: true }
    option: friend
  - optional: [{ blur: { css: ':focus' } }]
  - wait: 400
clip:
  span:
    - { css: '[data-tutorial=quick] > form' }
    - { css: '[data-tutorial=quick] > button' }
  pad: 16
marks:
  side: { label: Side, exact: true }
callouts:
  - { mark: side, n: 4, place: corner, badge: tr, inside: true }
