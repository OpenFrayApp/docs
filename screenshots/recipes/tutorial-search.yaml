name: tutorial-search
install: docs
url: http://localhost:5199/console/
viewport: { width: 1440, height: 820 }
retries: 0
setup:
  - click: { role: button, name: Not now, exact: true }
  - press: ControlOrMeta+k
  - fill: { css: 'input[aria-label="Search references"]' }
    value: tutorial
  - wait: 400
clip: { css: '[role=dialog]', contains: Start tutorial, pick: smallest, pad: 16 }
marks:
  start: { role: option, name: Start tutorial, exact: true }
callouts:
  - { mark: start }
