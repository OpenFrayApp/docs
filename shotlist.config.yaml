# yaml-language-server: $schema=node_modules/shotlist/dist/schema.json
#
# The handbook's screenshots. Run the console first — `npm run dev` — then
# `npx shotlist` to list the recipes, or `npx shotlist <name> --install` to re-shoot one.
# The site's marketing captures live in the site repo, with their own config.
#
# STYLE.md governs what a capture may show: the app's default dark theme, at 2×, red
# annotation, and sample data only — never a real name.

site:
  url: http://localhost:5199/console/
  viewport: { width: 1440, height: 900 }
  scale: 2
  theme: dark
  # The console renders before the compendium arrives, so a selector alone is not enough
  # to know the board is ready to shoot. The responsive shells keep a second, hidden Add
  # cluster in the DOM, so the wait names the visible one — and on the swipe shell the
  # add affordance is the single Add button, so either form counts.
  ready: 'button:has-text("Add creature"):visible, button[aria-label="Add to the encounter"]:visible'
  settle: 800

  # The signed-in Game Master, for the captures an account gates: campaigns, characters,
  # homebrew, and the import. `npx shotlist --login gm` opens a browser to sign in by
  # hand and writes the cookies; a recipe then asks for them with `session: gm`.
  #
  # The file holds a live session, so it lives outside the tree git tracks and is never
  # committed. `verify` is the account button, which the header only renders once
  # Supabase reports a user — so an expired sign-in fails the login rather than writing a
  # session that quietly shoots the anonymous console.
  #
  # This account is shared with the site repo's own captures, so its fixture data belongs
  # to both. Never clear the board and never delete what you did not create; see the
  # Screenshots section of AGENTS.md.
  sessions:
    gm:
      path: .shotlist/gm.json
      verify: 'button[aria-label="Account menu"]'

style:
  color: '#E5484A' # the red STYLE.md specifies
  canvas: '#020617' # the console's own background, so a margin is invisible
  label:
    # The console's own stack, so a callout is set in the same face as the interface it
    # points at. The generic entries always resolve, so this never falls back silently on
    # a machine without the named ones.
    font: "ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    weight: 700
    fill: '#FFFFFF'
    stroke: '#E5484A'
    # SVG centres a stroke on the glyph outline, so half of it is hidden under the fill.
    # Twelve here is the six the previous captures show outside each letter.
    strokeWidth: 12
  number:
    fill: '#E5484A'
    text: '#FFFFFF'

paths:
  recipes: screenshots/recipes
  macros: screenshots/macros
  data: screenshots/data
  out: screenshots/out

install:
  docs: src/assets/screens

finders:
  # The modal card owning a heading. The overlay behind it fills the viewport, so the
  # climb has to pass through every narrow ancestor to the outermost one — stopping at
  # the first would frame the heading, not the card.
  panel:
    heading: $1
    ancestor: { narrowerThan: 95vw, pick: outermost }

  # A tracker row: the smallest box holding both a combatant's name and an AC. The
  # console renders no test hooks here, so the shape is what identifies it.
  trackerRow:
    css: 'li, div'
    contains: $1
    matching: 'AC\s*\d'
    maxChildren: 24
    pick: smallest

  # A dialog that carries a given control, for the ones whose heading is not unique.
  dialogWith:
    css: div
    contains: $1
    minWidth: 400
    maxWidth: 90vw
    minHeight: 300
    pick: smallest
